spring:
  datasource:
    url: jdbc:h2:mem:voucher_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: embedded
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

server:
  port: 0

app:
  jwt:
    secret: test-jwt-secret-key-for-unit-tests-min-32-chars
    expiration-ms: 3600000
  voucher-code:
    prefix: SN
  callback:
    shared-secret: test-callback-secret

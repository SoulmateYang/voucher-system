spring:
  datasource:
    url: jdbc:mysql://localhost:3306/voucher_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:YOUR_JWT_SECRET_KEY_CHANGE_IN_PRODUCTION_MIN_32_CHARS}
    expiration-ms: 86400000
  voucher-code:
    prefix: SN
  callback:
    shared-secret: ${CALLBACK_SECRET:YOUR_CALLBACK_SECRET_CHANGE_IN_PRODUCTION}

logging:
  level:
    com.example.voucher: DEBUG
